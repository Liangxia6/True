[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "trueeval"
version = "0.1.0"
description = "TrueEval Deep Research evaluation workflow framework"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Proprietary" }
authors = [{ name = "TrueEval" }]
dependencies = [
    "pydantic>=2.8,<3",
    "typer>=0.12,<1",
    "httpx>=0.27,<1",
    "pyyaml>=6.0.1,<7",
    "cryptography>=43,<46",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3,<9",
    "pytest-asyncio>=0.24,<1",
    "ruff>=0.6,<1",
    "mypy>=1.11,<2",
    "types-pyyaml>=6.0.12,<7",
]
judge-openai = [
    "openai>=1.40,<2",
]
browsecomp = []
xbench = []
deepresearcheval = []

[project.scripts]
trueeval = "trueeval.cli.main:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
trueeval = ["py.typed"]

[tool.pytest.ini_options]
pythonpath = ["src"]
asyncio_mode = "auto"
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501", "B008", "UP017"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["trueeval"]
mypy_path = "src"
pretty = true
show_error_codes = true

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["B018"]
