schema_version: trueeval.run_config.v0.1
benchmark:
  id: tiny-research
  split: pilot
sut:
  id: metaso-research
  model: research
execution:
  repeats: 1
  submit_concurrency: 1
  poll_interval_seconds: 2
  task_timeout_seconds: 180
  allow_regeneration: false
  estimated_cost_usd_per_task: 0.05
grading:
  graders:
    - format-completeness
    - exact-match
budget:
  max_cost_usd: 5
gate:
  data_region: local
  authorized_channel: api
  operator: local
